name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install licensed Modelo webfonts
        run: npm run fonts:modelo
        env:
          MODELO_FONT_LIGHT_BASE64: ${{ secrets.MODELO_FONT_LIGHT_BASE64 }}
          MODELO_FONT_REGULAR_BASE64: ${{ secrets.MODELO_FONT_REGULAR_BASE64 }}
          MODELO_FONT_BOLD_BASE64: ${{ secrets.MODELO_FONT_BOLD_BASE64 }}
          MODELO_FONT_BLACK_BASE64: ${{ secrets.MODELO_FONT_BLACK_BASE64 }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
        env:
          PUBLIC_FORMSPREE_ENDPOINT: ${{ vars.PUBLIC_FORMSPREE_ENDPOINT }}
          PUBLIC_CLICK_COUNTER_URL: ${{ vars.PUBLIC_CLICK_COUNTER_URL }}
          PUBLIC_LINKEDIN_URL: ${{ vars.PUBLIC_LINKEDIN_URL }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
